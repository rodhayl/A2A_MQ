name: contracts
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: a2amq-contracts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  A2AMQ_NO_LLM_TOKENS: '1'
  PYTHONPATH: src
jobs:
  local:
    # This job validates the present code, not the missing full-MVP stack.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install pinned direct dependencies and check consistency
        run: |
          python -m pip install -e '.[dev,upstream,postgres]'
          python -m pip check
      - name: Require the official A2A SDK before collecting its tests
        run: python -c 'import a2a.types'
      - name: Repository contracts
        run: python tools/check.py
      - name: Lint
        run: ruff check .
      - name: Types
        run: mypy
      - name: Present contracts including upstream SDK tests
        id: tests
        run: |
          mkdir -p "$RUNNER_TEMP/a2amq-validation"
          python -m pytest -p no:cacheprovider -q -W error -m 'not live and not postgres' --junitxml="$RUNNER_TEMP/a2amq-validation/results.xml"
      - name: Reject missing, empty, failed, errored or skipped JUnit
        id: junit
        if: always()
        run: python scripts/assert_junit_complete.py "$RUNNER_TEMP/a2amq-validation/results.xml"
      - name: Retain only the JUnit evidence, never runtime secrets
        id: evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: contracts-python-${{ matrix.python }}-${{ github.sha }}
          path: ${{ runner.temp }}/a2amq-validation/results.xml
          if-no-files-found: error
          retention-days: 14

name: contracts
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  local:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev,upstream,postgres]'
      - run: python tools/check.py
      - run: ruff check .
      - run: mypy
      - run: python -m pytest -m 'not live and not postgres' --junitxml=results.xml

# Publisher-only illustration. Do not load this together with generated role components.
# Local only: no authentication or TLS. Stream A2A_MQ must already exist.
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: bus
spec:
  type: pubsub.jetstream
  version: v1
  metadata:
    - name: natsURL
      value: "nats://127.0.0.1:4222"
    - name: name
      value: "a2a-mq-publisher"
    - name: streamName
      value: "A2A_MQ"

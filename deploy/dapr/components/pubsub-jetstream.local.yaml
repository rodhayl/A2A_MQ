# Local-development component only.
# Production deployments must add TLS/authentication, scopes, HA/replication,
# secrets and role-specific consumer configuration.
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: a2a-pubsub
spec:
  type: pubsub.jetstream
  version: v1
  metadata:
    - name: natsURL
      value: "nats://localhost:4222"
    - name: name
      value: "a2a-mq-local"
    - name: streamName
      value: "A2A_MQ"
    - name: ackPolicy
      value: "explicit"
    - name: ackWait
      value: "30s"
    - name: maxDeliver
      value: "5"
    - name: backOff
      value: "1s, 5s, 30s, 2m"
    - name: memoryStorage
      value: "false"

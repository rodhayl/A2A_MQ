[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "a2a-mq"
version = "0.1.0"
description = "Experimental durable A2A task transport over Dapr Pub/Sub"
requires-python = ">=3.12"
dependencies = ["jsonschema==4.26.0", "httpx==0.28.1", "fastapi==0.128.2", "uvicorn==0.48.0"]

[project.optional-dependencies]
dev = ["pytest==9.0.2", "pytest-asyncio==1.3.0", "pytest-cov==7.0.0", "ruff==0.11.13", "mypy==1.15.0", "PyYAML==6.0.3"]
upstream = ["a2a-sdk==1.1.2"]
postgres = ["psycopg[binary]==3.2.9"]

[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
a2a_mq = ["schema.json", "py.typed"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = ["live: requires a running Dapr/JetStream stack", "postgres: requires a PostgreSQL DSN", "upstream: requires the pinned upstream SDK"]
[tool.ruff]
line-length = 110
target-version = "py312"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
[tool.mypy]
python_version = "3.12"
files = ["src/a2a_mq"]
check_untyped_defs = true
ignore_missing_imports = true
